<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<h1>Dog Adoption Form</h1>
	<form action="" method="post" class="dog-adoption">
		<label for="name">Name:</label>
		<input type="text" name="name" id="name" placeholder="Name" required />
        <br>
		<label for="number">Phone Number:</label>
		<input type="number" name="number" id="number" placeholder="Phone Number" required />
        <br>
		<label for="address">Address:</label>
		<input type="text" name="address" id="address" placeholder="Address" required />
        <br>
        <label for="checkbox">Have you ever lived with a Dog before?</label>
		<input type="checkbox" name="checkbox" id="checkbox"/>
        <br>
		<label for="multiSelect">Please select your preferred breeds</label>
		<select name="breeds" id="multiSelect">
			<option value="Dalmatian">Dalmatian</option>
			<option value="Labrador">Labrador</option>
			<option value="Husky">Husky</option>
		</select>
		<br>
		<input type="submit" id="submit" value="Submit" />
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
